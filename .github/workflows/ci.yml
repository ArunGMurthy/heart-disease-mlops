name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 src api tests --max-line-length=100 --extend-ignore=E203,W503

      - name: Run unit tests
        run: |
          pytest tests/ -v --junitxml=reports/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit.xml

      - name: Download dataset
        run: |
          python data/download_data.py

      - name: Train model
        run: |
          python -m src.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/model.pkl
            models/metadata.json

      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/

      - name: Upload EDA / evaluation figures
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: reports/figures/

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test-train
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Build Docker image
        run: docker build -t heart-disease-api:${{ github.sha }} .

      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name api-test heart-disease-api:${{ github.sha }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 3
          done
          curl -sf http://localhost:8000/health
          docker logs api-test
          docker stop api-test
